name: Docket
description: Put security findings (SARIF, Semgrep, Nuclei, Trivy, Gitleaks, or AI-agent output) on trial and keep only the ones with evidence.
branding: { icon: shield, color: blue }
inputs:
  findings: { description: "Findings file (SARIF, Semgrep JSON, Nuclei JSONL, Trivy JSON, Gitleaks JSON or Docket JSON)", required: true }
  scope: { description: "Path to scope.json", required: true }
  target: { description: "Source directory the findings refer to", default: "." }
  fail-on: { description: "never | survived | needs-human", default: "survived" }
  extra-args: { description: "Any other docket try flags (for example --judge anthropic:MODEL)", default: "" }
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: |
        docket try "${{ inputs.findings }}" --scope "${{ inputs.scope }}" --target "${{ inputs.target }}" \
          --json docket-report.json --sarif-out docket-survivors.sarif --markdown-out docket-summary.md \
          --pack docket-proof-pack.zip --fail-on "${{ inputs.fail-on }}" ${{ inputs.extra-args }}
    - if: always()
      shell: bash
      run: cat docket-summary.md >> "$GITHUB_STEP_SUMMARY" || true
