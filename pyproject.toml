[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docket"
version = "0.3.0"
description = "Every AI-generated security finding gets its day in court: proof, scope, blind judges and reachability checks that run code, not opinion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "ai", "llm", "triage", "false-positives", "pentest", "bug-bounty", "sarif", "mcp", "appsec"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
docket = "docket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docket = ["examples/*", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
